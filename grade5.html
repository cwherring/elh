<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grade 5 - Empower Learning Hub</title>
  <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="shortcut icon" href="/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-title" content="Empower" />
  <link rel="manifest" href="/site.webmanifest" /> 
  <script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brandBlue: '#1E40AF',
            brandGreen: '#10B981'
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Arial', sans-serif; }
    .bg-gradient { background: linear-gradient(135deg, #4F46E5, #10B981); }
    .hover-scale:hover { transform: scale(1.05); transition: transform 0.3s ease; }

    nav ul li a {
      color: #000 !important;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script>
    const { createElement: e, useState } = React;

    function NavBar() {
      const [isOpen, setIsOpen] = useState(false);

      return e('nav', { className: 'bg-gradient w-full p-4 sticky top-0 z-50' },
        e('div', {
          className: 'max-w-screen-xl container w-full flex flex-col items-start'
        },
          e('img', {
            src: 'images/empower-learning-hub-logo-sm-mini.svg',
            alt: 'Empower Learning Hub Logo',
            className: 'max-h-[100px] w-auto object-contain mb-4'
          }),
          e('ul', {
            className: 'flex flex-row flex-wrap gap-4 list-none text-black self-start'
          },
            e('li', null, e('a', { href: 'index.html', className: 'text-black hover:underline block py-2 md:py-0' }, 'Home')),
            e('li', null, e('a', { href: 'index.html#about', className: 'text-black hover:underline block py-2 md:py-0' }, 'About')),
            e('li', null, e('a', { href: 'index.html#classes', className: 'text-black hover:underline block py-2 md:py-0' }, 'Classes')),
            e('li', null, e('a', { href: 'enrollment.html', className: 'text-black hover:underline block py-2 md:py-0' }, 'Enroll')),
            e('li', null, e('a', { href: 'index.html#calendar', className: 'text-black hover:underline block py-2 md:py-0' }, 'Calendar')),
            e('li', null, e('a', { href: 'teachers.html', className: 'text-black hover:underline block py-2 md:py-0' }, 'Teachers')),
            e('li', null, e('a', { href: 'resources.html', className: 'text-black hover:underline block py-2 md:py-0' }, 'Resources')),
            //e('li', null, e('a', { href: 'blog.html', className: 'text-black hover:underline block py-2 md:py-0' }, 'Blog')),
            e('li', null, e('a', { href: 'index.html#contact', className: 'text-black hover:underline block py-2 md:py-0' }, 'Contact'))
          )
        )
      );
    }

    function Breadcrumb() {
      return e('nav', { className: 'bg-gray-100 p-4' },
        e('div', { className: 'container mx-auto' },
          e('a', { href: 'index.html', className: 'text-indigo-600 hover:underline' }, 'Home'),
          ' > ',
          e('a', { href: 'index.html#classes', className: 'text-indigo-600 hover:underline' }, 'Our Classes'),
          ' > Grade 5'
        )
      );
    }

    function Grade5Detail() {
      return e('section', { className: 'py-16' },
        e('div', { className: 'container mx-auto' },
          e('h2', { className: 'text-3xl font-bold mb-4' }, 'Grade 5'),
          
          e('div', { className: 'mb-8' },
            e('h3', { className: 'text-2xl font-semibold mb-2' }, 'Saxon Math 5th Grade: Tuesdays/Thursdays 9:30 – 10:30AM'),
            e('p', null, 'Teacher: ', e('a', { href: 'teachers.html#debby-herring', className: 'text-indigo-600 hover:underline' }, 'Debby Herring')),
            e('p', null, 'Saxon Math 6/5 is a homeschool math curriculum designed for 5th and 6th graders that builds on previous math knowledge and introduces new concepts through a spiral approach. It emphasizes mental math, problem-solving, and hands-on investigations. The curriculum is structured with daily lessons, practice problems, and cumulative tests.'),
            e('p', null, 'Curriculum: Saxon 6/5 homeschool version'),
            e('p', null, 'Homework: 1-2 hours weekly'),
            e('p', null, 'Class fee: $675/Class per student for the fall semester, which includes curriculum and a non-refundable deposit of $75.  The non-refundable deposit of $75 per class is required at enrollment to hold your student’s place. This fee covers the supplies needed for the class. The remainder is payable in $300 increments at the 6-week quarters.')
          ),
          e('div', { className: 'mb-8' },
            e('h3', { className: 'text-2xl font-semibold mb-2' }, 'History with Language Arts 5th/6th: Tuesdays/Thursdays 9:30AM – 12:30PM'),
            e('p', null, 'Teacher: ', e('a', { href: 'teachers.html#kelley-easley', className: 'text-indigo-600 hover:underline' }, 'Kelley Easley')),
            e('p', null, 'Fifth and Sixth graders will embark on a journey through the Middle Ages, meet some Vikings and Byzantines, enjoy Renaissance art and music, and explore the continents with the explorers. Writing projects, reading literature, projects, experiments, writing activities will be some of the activities students in this class will participate in throughout the year. The literature books will be provided.'),
            e('p', null, 'Curriculum: Tapestry of Grace, Year 2: Units 1-3'),
            e('p', null, 'Homework: Varies'),
            e('p', null, 'Class fee: $1900/Class per student for the fall semester, which includes curriculum and a non-refundable deposit of $100.  The non-refundable deposit of $100 per class is required at enrollment to hold your student’s place. This fee covers the supplies needed for the class. The remainder is payable in $900 increments at the 6-week quarters.')
          ),
    		  e('div', { className: 'mb-8' },
            e('h3', { className: 'text-2xl font-semibold mb-2' }, 'Language Arts for IEW Advanced Beginners: Wednesdays 10-11:30AM (Academic Advantage location)'),
            e('p', null, 'Teacher: ', e('a', { href: 'teachers.html#angie-tennant', className: 'text-indigo-600 hover:underline' }, 'Angie Tennant')),
      			e('p', null, 'Prerequisites: Basic knowledge of IEW before signing up for this class.'),
            e('p', null, 'Students will work through the units in the IEW Structure and Style curriculum at a faster pace and using slightly more challenging source texts. The goal this year is to reach at least unit 8.  Students will continue in Fix-It Grammar using Book 3 – Robin Hood.  Stronger vocabulary will be a goal since it’s an advanced class. This is a full language arts credit.'),
            e('p', null, 'Curriculum: IEW, Fix-It Grammar Book 3 - Robin Hood'),
            e('p', null, 'Homework: 1-2 hours weekly'),
            e('p', null, 'Class Fee: Contact Angie Tennant for price at angietennantiew at gmail dot com')
          ),
          e('div', { className: 'mb-8' },
            e('h3', { className: 'text-2xl font-semibold mb-2' }, 'Computer Literacy: Wednesday 1 – 2PM (Academic Advantage location)'),
            e('p', null, 'Teacher: ', e('a', { href: 'teachers.html#chris-herring', className: 'text-indigo-600 hover:underline' }, 'Chris Herring')),
            e('p', null, 'Computer Literacy is a dynamic course designed for students in grades 5–12 to develop essential digital skills for academic, personal, and professional success in a technology-driven world. This course introduces students to fundamental computer concepts, including hardware and software basics, operating systems, file management, and internet safety. Students will gain proficiency in productivity tools (e.g., word processing, spreadsheets, and presentations), basic coding concepts, digital citizenship, and data management. The course also covers emerging technologies, such as cloud computing, AI, and cybersecurity basics, to prepare students for real-world applications. Through hands-on projects, collaborative activities, and problem-solving tasks, students will build confidence in navigating and leveraging technology effectively.'),
            e('p', null, 'Homework: You can expect 2-4 hours of homework per week.'),
            e('p', null, 'Class fee: $410/Class per student for the fall semester, which includes curriculum and a non-refundable deposit of $50.  The non-refundable deposit of $50 per class is required at enrollment to hold your student’s place. This fee covers the supplies needed for the class. The remainder is payable in $180 increments at the 6-week quarters.')
          )
        )
      );
    }

    function Footer() {
      return e('footer', { className: 'bg-gradient text-white py-8' },
        e('div', { className: 'container mx-auto text-center' },
          e('p', null, '© 2025 Empower Learning Hub. All rights reserved.')
        )
      );
    }

    function App() {
      return e('div', null,
        e(NavBar),
        e(Breadcrumb),
        e(Grade5Detail),
        e(Footer)
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(e(App));
  </script>
</body>
</html>
