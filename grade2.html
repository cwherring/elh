<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grade 2 - Empower Learning Hub</title>
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
  <link href="css/tailwind.min.css" rel="stylesheet">
  <style>
    body { font-family: 'Arial', sans-serif; }
    .bg-gradient { background: linear-gradient(135deg, #4F46E5, #10B981); }
    .hover-scale:hover { transform: scale(1.05); transition: transform 0.3s ease; }
    nav ul { min-width: 0; text-align: left !important; }
    nav ul li { display: inline-block !important; }
    @media (min-width: 768px) {
      nav ul { display: flex !important; flex-direction: row !important; }
    }
    .hamburger-button {
      color: #1F2937 !important;
      background-color: rgba(255, 255, 255, 0.9);
      padding: 0.5rem 0.75rem;
      border-radius: 0.25rem;
      border: none;
    }
    .hamburger-button:hover {
      background-color: rgba(255, 255, 255, 1);
    }
    nav ul li a {
      color: #000 !important;
    }  </style>
</head>
<body>
  <div id="root"></div>
  <script>
    const { createElement: e, useState } = React;

    function NavBar() {
      const [isOpen, setIsOpen] = useState(false);
      const toggleMenu = () => setIsOpen(!isOpen);

      return e('nav', { className: 'bg-gradient text-white p-4 sticky top-0 z-10', style: { display: 'flex', flexDirection: 'row' } },
        e('div', { className: 'container mx-auto flex justify-between items-center', style: { justifyContent: 'space-between !important' } },
          e('h1', { className: 'text-2xl font-bold' }, 'Empower Learning Hub'),
      e('img', {
        src: 'images/empower-learning-hub-logo-sm-mini.svg',
        alt: 'Empower Learning Hub Logo',
        className: 'h-50px sm:h-8px w-auto max-w-full object-contain'
      }),
          e('ul', { 
            className: `flex flex-col md:flex-row md:items-center md:space-x-6 ${isOpen ? 'block' : 'hidden'} md:flex md:mt-0`,
            style: { display: 'flex', flexDirection: 'row !important', alignItems: 'center', gap: '1.5rem', textAlign: 'left' }
          },
            e('li', null, e('a', { href: 'index.html', className: 'text-black hover:underline block py-2 md:py-0' }, 'Home')),
            e('li', null, e('a', { href: 'index.html#about', className: 'text-black hover:underline block py-2 md:py-0' }, 'About')),
            e('li', null, e('a', { href: 'index.html#classes', className: 'text-black hover:underline block py-2 md:py-0' }, 'Classes')),
            e('li', null, e('a', { href: 'enrollment.html', className: 'text-black hover:underline block py-2 md:py-0' }, 'Enroll')),
            e('li', null, e('a', { href: 'index.html#calendar', className: 'text-black hover:underline block py-2 md:py-0' }, 'Calendar')),
            e('li', null, e('a', { href: 'teachers.html', className: 'text-black hover:underline block py-2 md:py-0' }, 'Teachers')),
            e('li', null, e('a', { href: 'resources.html', className: 'text-black hover:underline block py-2 md:py-0' }, 'Resources')),
            //e('li', null, e('a', { href: 'blog.html', className: 'text-black hover:underline block py-2 md:py-0' }, 'Blog')),
            e('li', null, e('a', { href: 'index.html#contact', className: 'text-black hover:underline block py-2 md:py-0' }, 'Contact'))
          )
        )
      );
    }

    function Breadcrumb() {
      return e('nav', { className: 'bg-gray-100 p-4' },
        e('div', { className: 'container mx-auto' },
          e('a', { href: 'index.html', className: 'text-indigo-600 hover:underline' }, 'Home'),
          ' > ',
          e('a', { href: 'index.html#classes', className: 'text-indigo-600 hover:underline' }, 'Our Classes'),
          ' > Grade 2'
        )
      );
    }

    function Grade2Detail() {
      return e('section', { className: 'py-16' },
        e('div', { className: 'container mx-auto' },
          e('h2', { className: 'text-3xl font-bold mb-4' }, 'Grade 2'),
          e('div', { className: 'mb-8' },
            e('h3', { className: 'text-2xl font-semibold mb-2' }, 'Reading: Thursdays 9:30 – 10:50AM'),
            e('p', null, 'Teacher: ', e('a', { href: 'bios/debby-herring.html', className: 'text-indigo-600 hover:underline' }, 'Debby Herring')),
            e('p', null, 'Students will be reading from different types of writing as well as different favorite and/or classic children’s authors like Mo Willems, Arnold Lobel, Cynthia Rylant, and Marc Brown. We will be focusing on comprehension strategies as well as decoding skills. Second semester we will move into reading short chapter books like Magic Treehouse (maybe sooner if they are ready).'),
            e('p', null, 'Homework: Students will be asked to read 20 – 30 minutes nightly and complete some comprehension activities.'),
            e('p', null, 'Class fee: $525/Class per student for the fall semester, which includes curriculum and a non-refundable deposit of $75.  The non-refundable deposit of $75 per class is required at enrollment to hold your student’s place. This fee covers the supplies needed for the class. The remainder is payable in $225 increments at the 6-week quarters.')
          ),
          e('div', { className: 'mb-8' },
            e('h3', { className: 'text-2xl font-semibold mb-2' }, 'Language Arts (Writing, Spelling, and Grammar): Thursdays 11:00AM – 12:30PM'),
            e('p', null, 'Teacher: ', e('a', { href: 'bios/debby-herring.html', className: 'text-indigo-600 hover:underline' }, 'Debby Herring')),
            e('p', null, 'Students will continue to hone their writing skills by learning to make their sentences longer and stronger and using the spelling patterns they are learning in their writing. We will also be doing some beginning editing.'),
            e('p', null, 'Homework will consist of journal writing assignments, spelling work, and an occasional grammar activity.'),
            e('p', null, 'Curriculum: All About Spelling 2, Evan-Moor Grammar and Punctuation 2, A Reason for Writing – Words of Jesus'),
            e('p', null, 'Class fee: $525/Class per student for the fall semester, which includes curriculum and a non-refundable deposit of $75.  The non-refundable deposit of $75 per class is required at enrollment to hold your student’s place. This fee covers the supplies needed for the class. The remainder is payable in $225 increments at the 6-week quarters.')
          ),
          e('div', { className: 'mb-8' },
            e('h3', { className: 'text-2xl font-semibold mb-2' }, 'RightStart Math: Wednesdays 10:30AM – 12:00PM'),
            e('p', null, 'Teacher: ', e('a', { href: 'bios/debby-herring.html', className: 'text-indigo-600 hover:underline' }, 'Debby Herring')),
            e('p', null, 'Students will continue to build their strong foundation in math through the activities and games in RightStart Math Level C.'),
            e('p', null, 'Homework: Students will practice math concepts through math games and an occasional math worksheet.'),
            e('p', null, 'Class fee: $525/Class per student for the fall semester, which includes curriculum and a non-refundable deposit of $75.  The non-refundable deposit of $75 per class is required at enrollment to hold your student’s place. This fee covers the supplies needed for the class. The remainder is payable in $225 increments at the 6-week quarters.')
          )
        )
      );
    }

    function Footer() {
      return e('footer', { className: 'bg-gradient text-white py-8' },
        e('div', { className: 'container mx-auto text-center' },
          e('p', null, '© 2025 Empower Learning Hub. All rights reserved.')
        )
      );
    }

    function App() {
      return e('div', null,
        e(NavBar),
        e(Breadcrumb),
        e(Grade2Detail),
        e(Footer)
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(e(App));
  </script>
</body>
</html>
