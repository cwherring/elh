			      e('p', null, 'Requirements: Only a personal laptop, such as a Chromebook, needs to be provided by the student.'),
            e('p', null, 'Math:\tI am experienced in teaching math through Algebra 2 and enjoy helping students grow in confidence and see the beauty of math. Our Learning Nest will focus on solidifying middle school concepts like fractions, decimals, percents, and basic geometry. In conjunction with Physical Science, we will study unit conversions and scientific notation. We will embark on building the foundational skills of algebra, including solving equations with one and two variables, graphing linear equations, working with exponents, and more. Instruction will be tailored to the needs of the students and will be taught using a customized curriculum. Students will be given copies of my selected text to use as a reference at home.'),
            e('p', null, 'Science:\tWe will be studying Physical Science this year, and I especially look forward to hands-on labs related to engineering. We will be using Journey Homeschool’s video lectures and note-taking aids, as well as Novare’s Physical Science textbook, to study at home. During class, we will review content highlights, master vocabulary, consider current advancements and applications in the field, and complete labs.'),
            e('p', null, 'Social Studies and English Language Arts:\tWe will integrate these two subjects for a rich and meaningful experience. Our study of history and ELA will be rooted in what I’m calling our “Family History Project”, “Autobiography and Journaling Project”, and “Diversity and Perspectives Project”. Students will be given the Abeka text "America: Land I Love" as a spine text to study. Students will be instructed in grammar, mechanics, composition, AI use, and writer bias as these topics arise organically through our projects. Students will practice online etiquette and academic accountability as they log in to Google Classroom every week to post an answer to a discussion question and respond to their classmates.'),
            e('p', null, 'Family History Project:\tNow is a great time to engage students in history by encouraging them to place their relatives into world events. This deepens students’ family ties and creates a more personal connection to history. When I taught the Family History Project previously, I heard beautiful feedback from families about the precious moments they experienced with loved ones as a result of the project. As students interview their relatives on topics such as immigration, wars, political policy, home life, childhood diseases, hobbies, careers, and more, the students will make connections not only with their loved ones but also to historical events and our changing world. After interviews and research, students will write about their family’s history and the context of the time in which their relatives lived.'),
            e('p', null, 'Autobiography and Journaling Project:\tAs we study family history, we will look at the time in which we are presently living and how our story will be of interest to our descendants. In connection with this, students will write an autobiography as well as keep a journal. As part of their journaling, we will be looking at current events through platforms such as World Watch and PBS Newshour for Kids. Students will be asked to summarize events and draw conclusions. Journals will be private writings that students will reference for discussions, unlike the other projects that will be graded for grammar, mechanics, and content.'),
            e('p', null, 'Diversity and Perspectives Project:\tAs our final piece, we will be writing persuasive essays using the method and language taught in The Lost Tools of Writing. We will read books such as A Long Walk to Water, Tiger Daughter, The Breadwinner, and The Pearl. Books like these will allow students to consider narratives quite different from their own. As time allows, we will explore geography, politics, religion, and cultural practices from around the world through these books. After reading each book, the students will write a persuasive essay on whether a character should have made a specific decision. I look forward to spirited debates and insightful moments as students stretch their ability to reason, view an issue from multiple angles, and eloquently argue their position.'),

            e('p', null, 'Government is a comprehensive course for students in grades 9–12 that examines the structure, functions, and principles of the United States government, its role within a global context, and contrasted with other common forms of government. The course covers the foundations of American democracy, including the Constitution, federalism, the three branches of government, civil liberties, and civic responsibilities. Students will explore key concepts such as checks and balances, the rule of law, and the rights and responsibilities of citizenship. Special emphasis will be placed on preparing students for the Arkansas Civics Exam, with targeted instruction on the U.S. Constitution, the Declaration of Independence, and foundational civic principles as required by Arkansas state standards. Through case studies, primary source analysis, debates, and simulations, students will develop critical thinking, analytical, and civic engagement skills necessary for active participation in a democratic society.'),
