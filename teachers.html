<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teachers - Empower Learning Hub</title>
  <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="shortcut icon" href="/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-title" content="Empower" />
  <link rel="manifest" href="/site.webmanifest" /> 
  <script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brandBlue: '#1E40AF',
            brandGreen: '#10B981'
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Arial', sans-serif; }
    .bg-gradient { background: linear-gradient(135deg, #4F46E5, #10B981); }
    .hover-scale:hover { transform: scale(1.05); transition: transform 0.3s ease; }
    nav ul li a {
      color: #000 !important;
    }
    iframe {
    scroll-margin-top: 225px;
    }   
  </style>
</head>
<body>
  <div id="root"></div>
  <script>
    const { createElement: e, useState, useEffect } = React;

    function NavBar() {
      const [isOpen, setIsOpen] = useState(false);

      return e('nav', { className: 'bg-gradient w-full p-4 sticky top-0 z-50' },
        e('div', {
          className: 'max-w-screen-xl container w-full flex flex-col items-start'
        },
          e('img', {
            src: 'images/empower-learning-hub-logo-sm-mini.svg',
            alt: 'Empower Learning Hub Logo',
            className: 'max-h-[100px] w-auto object-contain mb-4'
          }),
          e('ul', {
            className: 'flex flex-row flex-wrap gap-4 list-none text-black self-start'
          },
            e('li', null, e('a', { href: 'index.html', className: 'text-black hover:underline block py-2 md:py-0' }, 'Home')),
            e('li', null, e('a', { href: 'index.html#about', className: 'text-black hover:underline block py-2 md:py-0' }, 'About')),
            e('li', null, e('a', { href: 'index.html#classes', className: 'text-black hover:underline block py-2 md:py-0' }, 'Classes')),
            e('li', null, e('a', { href: 'enrollment.html', className: 'text-black hover:underline block py-2 md:py-0' }, 'Enroll')),
            e('li', null, e('a', { href: 'index.html#calendar', className: 'text-black hover:underline block py-2 md:py-0' }, 'Calendar')),
            e('li', null, e('a', { href: 'teachers.html', className: 'text-black hover:underline block py-2 md:py-0' }, 'Teachers')),
            e('li', null, e('a', { href: 'resources.html', className: 'text-black hover:underline block py-2 md:py-0' }, 'Resources')),
            //e('li', null, e('a', { href: 'blog.html', className: 'text-black hover:underline block py-2 md:py-0' }, 'Blog')),
            e('li', null, e('a', { href: 'index.html#contact', className: 'text-black hover:underline block py-2 md:py-0' }, 'Contact'))
          )
        )
      );
    }

    function TeacherBios() {
      const bioFiles = [
        'angie-tennant.html',
        'beth-jennings.html',
        'chris-herring.html',
        'crystal-schmidt.pdf',
        'debby-herring.html',
        'kacy-tribble.html',
        'kelley-easley.html'
        //'lori-brinson.html'
      ];

      const teachers = bioFiles.map(file => ({
        file,
        name: file.replace('.pdf', '').replace('.html', '').split('-').map(word => word.charAt(0).toUpperCase() + word.slice(1)).join(' '),
        sectionid: file.replace('.pdf', '').replace('.html', '')
       }));

      return e('section', { className: 'py-16 bg-gray-100' },
        e('div', { className: 'container mx-auto' },
          e('h2', { className: 'text-3xl font-bold text-center mb-8' }, 'Meet Our Teachers'),
          e('p', { className: 'text-lg text-center max-w-2xl mx-auto mb-8' },
            'Our dedicated educators bring passion and expertise to Empower Learning Hub, serving the Northwest Arkansas area.'
          ),
          e('div', { className: 'grid grid-cols-1 md:grid-cols-2 gap-8' },
            teachers.map((teacher, index) => {
              const isPDF = teacher.file.endsWith('.pdf');
              return e('div', { key: index, className: 'bg-white p-6 rounded-lg shadow-lg hover-scale' },
                //e('h3', { className: 'text-xl font-semibold text-center mb-4' }, teacher.name),
                e('iframe', {
                  id: `${teacher.sectionid}`,
                  src: `bios/${teacher.file}`,
                  className: 'w-full border-0',
                  style: { height: '600px' },
                  type: isPDF ? 'application/pdf' : 'text/html'
                })
              );
            })
          )
        )
      );
    }

    function Footer() {
      return e('footer', { className: 'bg-gradient text-white py-8' },
        e('div', { className: 'container mx-auto text-center' },
          e('p', null, '© 2025 Empower Learning Hub. All rights reserved.')
        )
      );
    }

    function App() {
      useEffect(() => {
        const handleAnchorClick = (e) => {
          const anchor = e.target.closest('a[href^="#"]');
          if (!anchor) return;

          const targetId = anchor.getAttribute('href').substring(1);
          const targetElement = document.getElementById(targetId);
          if (targetElement) {
            e.preventDefault();
            const headerHeight = document.querySelector('nav')?.offsetHeight || 0;
            const targetPosition = targetElement.getBoundingClientRect().top + window.pageYOffset - headerHeight;
            window.scrollTo({ top: targetPosition, behavior: 'smooth' });
          }
        };

        document.addEventListener('click', handleAnchorClick);
        return () => document.removeEventListener('click', handleAnchorClick);
      }, []);

      return e('div', null,
        e(NavBar),
        e(TeacherBios),
        e(Footer)
      );
    }

    ReactDOM.render(e(App), document.getElementById('root'));
  </script>
</body>
</html>
