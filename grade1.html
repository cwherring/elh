<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grade 1 - Empower Learning Hub</title>
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brandBlue: '#1E40AF',
            brandGreen: '#10B981'
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Arial', sans-serif; }
    .bg-gradient { background: linear-gradient(135deg, #4F46E5, #10B981); }
    .hover-scale:hover { transform: scale(1.05); transition: transform 0.3s ease; }
    nav ul li a {
      color: #000 !important;
    }  </style>
</head>
<body>
  <div id="root"></div>
  <script>
    const { createElement: e, useState } = React;

    function NavBar() {
      const [isOpen, setIsOpen] = useState(false);

      return e('nav', { className: 'bg-gradient w-full p-4 sticky top-0 z-50' },
        e('div', {
          className: 'max-w-screen-xl container w-full flex flex-col items-start'
        },
          e('img', {
            src: 'images/empower-learning-hub-logo-sm-mini.svg',
            alt: 'Empower Learning Hub Logo',
            className: 'max-h-[100px] w-auto object-contain mb-4'
          }),
          e('ul', {
            className: 'flex flex-row flex-wrap gap-4 list-none text-black self-start'
          },
            e('li', null, e('a', { href: 'index.html', className: 'text-black hover:underline block py-2 md:py-0' }, 'Home')),
            e('li', null, e('a', { href: 'index.html#about', className: 'text-black hover:underline block py-2 md:py-0' }, 'About')),
            e('li', null, e('a', { href: 'index.html#classes', className: 'text-black hover:underline block py-2 md:py-0' }, 'Classes')),
            e('li', null, e('a', { href: 'enrollment.html', className: 'text-black hover:underline block py-2 md:py-0' }, 'Enroll')),
            e('li', null, e('a', { href: 'index.html#calendar', className: 'text-black hover:underline block py-2 md:py-0' }, 'Calendar')),
            e('li', null, e('a', { href: 'teachers.html', className: 'text-black hover:underline block py-2 md:py-0' }, 'Teachers')),
            e('li', null, e('a', { href: 'resources.html', className: 'text-black hover:underline block py-2 md:py-0' }, 'Resources')),
            //e('li', null, e('a', { href: 'blog.html', className: 'text-black hover:underline block py-2 md:py-0' }, 'Blog')),
            e('li', null, e('a', { href: 'index.html#contact', className: 'text-black hover:underline block py-2 md:py-0' }, 'Contact'))
          )
        )
      );
    }

    function Breadcrumb() {
      return e('nav', { className: 'bg-gray-100 p-4' },
        e('div', { className: 'container mx-auto' },
          e('a', { href: 'index.html', className: 'text-indigo-600 hover:underline' }, 'Home'),
          ' > ',
          e('a', { href: 'index.html#classes', className: 'text-indigo-600 hover:underline' }, 'Our Classes'),
          ' > Grade 1'
        )
      );
    }

    function Grade1Detail() {
      return e('section', { className: 'py-16' },
        e('div', { className: 'container mx-auto' },
          e('h2', { className: 'text-3xl font-bold mb-4' }, 'Grade 1'),
          e('div', { className: 'mb-8' },
            e('h3', { className: 'text-2xl font-semibold mb-2' }, 'Reading: Tuesdays 9:30 – 10:50AM'),
            e('p', null, 'Teacher: ', e('a', { href: 'teachers.html#debby-herring', className: 'text-indigo-600 hover:underline' }, 'Debby Herring')),
            e('p', null, 'Students will be taught phonics and sight words as strategies to learn to read. Students will decode (sound out words), memorize sight words and learn to read short decodable books and stories.'),
            e('p', null, 'Curriculum: All About Reading 1 and various literature'),
            e('p', null, 'Homework: 30-45 minutes daily (reading and practicing phonics)'),
            e('p', null, 'Class fee: $525/Class per student for the fall semester, which includes curriculum and a non-refundable deposit of $75.  The non-refundable deposit of $75 per class is required at enrollment to hold your student’s place. This fee covers the supplies needed for the class. The remainder is payable in $225 increments at the 6-week quarters.')
          ),
          e('div', { className: 'mb-8' },
            e('h3', { className: 'text-2xl font-semibold mb-2' }, 'Language Arts (Writing, Spelling, and Grammar): Tuesdays 11:00AM – 12:30PM'),
            e('p', null, 'Teacher: ', e('a', { href: 'teachers.html#debby-herring', className: 'text-indigo-600 hover:underline' }, 'Debby Herring')),
            e('p', null, 'Students will learn to write words and sentences and eventually stories about their drawings in their journals. They will have the opportunity to share their stories with their peers. Second semester students will begin to use their phonics skills to “book spell” (Correct spelling) of three-four letter short vowel words. Students will also learn the parts of a sentence, proper capitalization and punctuation as well as nouns, verbs, adjectives and more. Students will write stories, make a list, write invitations and thank you notes and other real world writing applications.'),
            e('p', null, 'Curriculum: Evan-Moor Grammar and Punctuation 1, All About Spelling 1 (second semester)'),
            e('p', null, 'Homework: 30-45 minutes - Students will have journal writing assignments as well as occasional grammar homework.'),
            e('p', null, 'Class fee: $525/Class per student for the fall semester, which includes curriculum and a non-refundable deposit of $75.  The non-refundable deposit of $75 per class is required at enrollment to hold your student’s place. This fee covers the supplies needed for the class. The remainder is payable in $225 increments at the 6-week quarters.')
          ),
          e('div', { className: 'mb-8' },
            e('h3', { className: 'text-2xl font-semibold mb-2' }, 'RightStart Math: Wednesdays 9:00 – 10:25AM (Academic Advantage location)'),
            e('p', null, 'Teacher: ', e('a', { href: 'teachers.html#debby-herring', className: 'text-indigo-600 hover:underline' }, 'Debby Herring')),
            e('p', null, 'Students will be taught number concepts, addition and subtraction concepts as well as time to the hour and half hour, identifying and counting similar groups of coins and basic geometry (shapes).'),
            e('p', null, 'Curriculum: RightStart Level A and B'),
            e('p', null, 'Homework will consist of math card games Mrs. Herring will teach you and some occasional math worksheets.'),
            e('p', null, 'Class fee: $525/Class per student for the fall semester, which includes curriculum and a non-refundable deposit of $75.  The non-refundable deposit of $75 per class is required at enrollment to hold your student’s place. This fee covers the supplies needed for the class. The remainder is payable in $225 increments at the 6-week quarters.')
          )
        )
      );
    }

    function Footer() {
      return e('footer', { className: 'bg-gradient text-white py-8' },
        e('div', { className: 'container mx-auto text-center' },
          e('p', null, '© 2025 Empower Learning Hub. All rights reserved.')
        )
      );
    }

    function App() {
      return e('div', null,
        e(NavBar),
        e(Breadcrumb),
        e(Grade1Detail),
        e(Footer)
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(e(App));
  </script>
</body>
</html>
