<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enrollment Form - Empower Learning Hub</title>
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brandBlue: '#1E40AF',
            brandGreen: '#10B981'
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Arial', sans-serif; }
    .bg-gradient { background: linear-gradient(135deg, #4F46E5, #10B981); }
    .hover-scale:hover { transform: scale(1.05); transition: transform 0.3s ease; }
    section[id] { padding-top: 4rem; margin-top: -4rem; }
    html { scroll-behavior: smooth; }
    nav ul li a {
      color: #000 !important;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script>
    const { createElement: e, useState } = React;

    function NavBar() {
      const [isOpen, setIsOpen] = useState(false);

      return e('nav', { className: 'bg-gradient w-full p-4 sticky top-0 z-50' },
        e('div', {
          className: 'max-w-screen-xl container w-full flex flex-col items-start'
        },
          e('img', {
            src: 'images/empower-learning-hub-logo-sm-mini.svg',
            alt: 'Empower Learning Hub Logo',
            className: 'max-h-[100px] w-auto object-contain mb-4'
          }),
          e('ul', {
            className: 'flex flex-row flex-wrap gap-4 list-none text-black self-start'
          },
            e('li', null, e('a', { href: 'index.html', className: 'text-black hover:underline block py-2 md:py-0' }, 'Home')),
            e('li', null, e('a', { href: 'index.html#about', className: 'text-black hover:underline block py-2 md:py-0' }, 'About')),
            e('li', null, e('a', { href: 'index.html#classes', className: 'text-black hover:underline block py-2 md:py-0' }, 'Classes')),
            e('li', null, e('a', { href: 'enrollment.html', className: 'text-black hover:underline block py-2 md:py-0' }, 'Enroll')),
            e('li', null, e('a', { href: 'index.html#calendar', className: 'text-black hover:underline block py-2 md:py-0' }, 'Calendar')),
            e('li', null, e('a', { href: 'teachers.html', className: 'text-black hover:underline block py-2 md:py-0' }, 'Teachers')),
            e('li', null, e('a', { href: 'resources.html', className: 'text-black hover:underline block py-2 md:py-0' }, 'Resources')),
            //e('li', null, e('a', { href: 'blog.html', className: 'text-black hover:underline block py-2 md:py-0' }, 'Blog')),
            e('li', null, e('a', { href: 'index.html#contact', className: 'text-black hover:underline block py-2 md:py-0' }, 'Contact'))
          )
        )
      );
    }

    function EnrollmentForm() {
      const elementaryClasses = [
        { name: 'reading_1st', label: 'Reading (1st, Tuesdays 9:30–10:50AM)' },
        { name: 'reading_2nd', label: 'Reading (2nd, Thursdays 9:30–10:50AM)' },
        { name: 'language_arts_1st', label: 'Language Arts (1st, Writing, Spelling, and Grammar, Tuesdays 11:00AM – 12:30PM)' },
        { name: 'language_arts_2nd', label: 'Language Arts (2nd, Writing, Spelling, and Grammar, Thursdays 11:00AM – 12:30PM)' },
        { name: 'math_1st', label: 'RightStart Math (1st, Wednesdays 9:00 – 10:25AM) (Academic Advantage location)' },
        { name: 'math_2nd', label: 'RightStart Math (2nd, Wednesdays 9:00 – 10:25AM) (Academic Advantage location)' },
        { name: 'math_3rd', label: 'RightStart Math (3rd, Tuesdays/Thursdays 8:30 – 9:30AM)' },
        { name: 'history_la_3rd_4th', label: 'History with Language Arts (3rd/4th, Tuesdays/Thursdays 9:30AM – 12:30PM)' },
        { name: 'saxon_math_4th', label: 'Saxon Math 5/4 (4th, Tuesdays/Thursdays 8:30 – 9:30AM)' },
        { name: 'saxon_math_5th', label: 'Saxon Math (5th, Tuesdays/Thursdays 9:30 – 10:30AM)' },
        { name: 'history_la_5th_6th', label: 'History with Language Arts (5th/6th, Tuesdays/Thursdays 9:30AM – 12:30PM)' },
        { name: 'la_iew_5th_6th', label: 'Language Arts for IEW Advanced Beginners (5th/6th, Wednesdays 10-11:30AM) (Academic Advantage location)' },
        { name: 'computer_literacy_5th_6th', label: 'Computer Literacy (5th/6th, Wednesdays 1:00–2:00 PM, Requires Laptop/Tablet) (Academic Advantage location)' },
      ];

      const jrHighClasses = [
        { name: 'learning_nest_7th_8th', label: 'Learning Nest 2025-2026 (7th/8th, Tuesdays/Thursdays 9:00AM - 12:00PM) (Catalyst)' },
        { name: 'algebra_1_8th', label: 'Algebra 1 (8th, Tuesdays/Thursdays 1:00–1:55 PM, Prerequisite: Pre-Algebra)' },
        { name: 'intro_cs_python_8th', label: 'Intro to Computer Science with Python (8th, Tuesdays/Thursdays 2:30–3:25 PM, Prerequisite: Computer Literacy, Requires Laptop/Tablet)' },
        { name: 'la_iew_7th_8th', label: 'Language Arts for IEW Advanced Beginners (7th/8th, Wednesdays 10-11:30AM)' },
        { name: 'physical_science_8th', label: 'Physical Science (8th, Wednesdays 10:30–11:55 AM, Prerequisite: Algebra 1 or concurrent)' },
        { name: 'computer_literacy_7th_8th', label: 'Computer Literacy (7th/8th, Wednesdays 1:00–2:00 PM, Requires Laptop/Tablet)' },
      ];

      const highSchoolClasses = [
        { name: 'learning_nest_9th', label: 'Learning Nest 2025-2026 (9th, Tuesdays/Thursdays 9:00AM - 12:00PM) (Catalyst)' },
        { name: 'algebra_2_11th_12th', label: 'Algebra 2 (11th/12th, Tuesdays/Thursdays 9:00–9:55 AM, Prerequisite: Algebra 1, Geometry)' },
        { name: 'geometry_10th_12th', label: 'High School Geometry (10th/12th, Tuesdays/Thursdays 10:00–10:55 AM, Prerequisite: Algebra 1)' },
        { name: 'precalculus_11th_12th', label: 'Pre-Calculus (11th/12th, Tuesdays/Thursdays 11:00–11:55 AM, Prerequisite: Algebra 2, Geometry)' },
        { name: 'algebra_1_9th_10th', label: 'Algebra 1 (9th/10th, Tuesdays/Thursdays 1:00–1:55 PM, Prerequisite: Pre-Algebra)' },
        { name: 'american_history_lit_9th_12th', label: 'American History with Literature (9th/12th, Tuesdays/Thursdays 1:30–2:25 PM, No Prerequisites)' },
        { name: 'government_9th_12th', label: 'Government (9th/12th, Tuesdays/Thursdays 1:30–2:25 PM, No Prerequisites)' },
        { name: 'intro_cs_python_9th_12th', label: 'Intro to Computer Science with Python (9th/12th, Tuesdays/Thursdays 2:30–3:25 PM, Prerequisite: Computer Literacy)' },
        { name: 'physical_science_9th_12th', label: 'Physical Science (9th/12th, Wednesdays 10:30–11:55 AM, Prerequisite: Algebra 1 or concurrent)' },
        { name: 'computer_literacy_9th_12th', label: 'Computer Literacy (9th/12th, Wednesdays 1:00–2:00 PM, Requires Laptop/Tablet)' },
        { name: 'chemistry_9th_12th', label: 'Chemistry (9th/12th, Wednesdays 1:30–3:00 PM, Prerequisite: Algebra 1, Physical Science)' },
        { name: 'world_history_9th_12th', label: 'Survey of World History (9th/12th, Wednesdays 1:30–3:00 PM, No Prerequisites)' },
      ];

      return e('section', { id: 'enrollment', className: 'py-16 bg-gray-100' },
        e('div', { className: 'container mx-auto' },
          e('h2', { className: 'text-3xl font-bold text-center mb-8' }, 'Class Enrollment Form'),
          e('form', { action: 'https://formspree.io/f/movlnqdn', method: 'POST', className: 'max-w-lg mx-auto bg-white p-8 rounded-lg shadow-lg' },
            e('input', { type: 'hidden', name: '_next', value: 'https://empowerlearninghub.com/thank-you.html' }),
            e('input', { type: 'hidden', name: '_gotcha' }),
            e('h3', { className: 'text-2xl font-semibold mb-4' }, 'Parent/Guardian Information'),
            e('div', { className: 'mb-4' },
              e('label', { htmlFor: 'parent_name', className: 'block text-gray-700 mb-2' }, 'Parent/Guardian Name'),
              e('input', { type: 'text', id: 'parent_name', name: 'parent_name', className: 'w-full p-3 border rounded-lg', placeholder: 'Your Name', required: true })
            ),
            e('div', { className: 'mb-4' },
              e('label', { htmlFor: 'parent_email', className: 'block text-gray-700 mb-2' }, 'Email Address'),
              e('input', { type: 'email', id: 'parent_email', name: '_replyto', className: 'w-full p-3 border rounded-lg', placeholder: 'Your Email', required: true })
            ),
            e('div', { className: 'mb-4' },
              e('label', { htmlFor: 'parent_phone', className: 'block text-gray-700 mb-2' }, 'Phone Number'),
              e('input', { type: 'tel', id: 'parent_phone', name: 'parent_phone', className: 'w-full p-3 border rounded-lg', placeholder: 'Your Phone Number', required: true })
            ),
            e('h3', { className: 'text-2xl font-semibold mb-4 mt-6' }, 'Student Information'),
            e('div', { className: 'mb-4' },
              e('label', { htmlFor: 'student_name', className: 'block text-gray-700 mb-2' }, 'Student Name'),
              e('input', { type: 'text', id: 'student_name', name: 'student_name', className: 'w-full p-3 border rounded-lg', placeholder: 'Student Name', required: true })
            ),
            e('div', { className: 'mb-4' },
              e('label', { htmlFor: 'student_age', className: 'block text-gray-700 mb-2' }, 'Age'),
              e('input', { type: 'number', id: 'student_age', name: 'student_age', className: 'w-full p-3 border rounded-lg', placeholder: 'Age', required: true })
            ),
            e('div', { className: 'mb-4' },
              e('label', { htmlFor: 'student_birthday', className: 'block text-gray-700 mb-2' }, 'Birthday (MM/DD/YYYY)'),
              e('input', { type: 'text', id: 'student_birthday', name: 'student_birthday', className: 'w-full p-3 border rounded-lg', placeholder: 'MM/DD/YYYY', required: true })
            ),
            e('div', { className: 'mb-4' },
              e('label', { htmlFor: 'student_allergies', className: 'block text-gray-700 mb-2' }, 'Allergies (if none, write “None”)'),
              e('input', { type: 'text', id: 'student_allergies', name: 'student_allergies', className: 'w-full p-3 border rounded-lg', placeholder: 'Allergies', required: true })
            ),
            e('h3', { className: 'text-2xl font-semibold mb-4 mt-6' }, 'Class Selection'),
            e('p', { className: 'mb-4' }, 'Select the classes you wish to enroll in by checking the appropriate boxes. Ensure the student meets the grade level and prerequisites for each class.'),
            e('h4', { className: 'text-xl font-semibold mb-2' }, 'Elementary Grades'),
            e('p', { className: 'mb-2' }, 'Offered at the Catalyst location unless otherwise noted.'),
            elementaryClasses.map(cls =>
              e('div', { key: cls.name, className: 'mb-2' },
                e('label', null,
                  e('input', { type: 'checkbox', name: cls.name, className: 'mr-2' }),
                  cls.label
                )
              )
            ),
            e('h4', { className: 'text-xl font-semibold mb-2 mt-4' }, 'Jr High Grades'),
            e('p', { className: 'mb-2' }, 'Offered at the Academic Advantage location unless otherwise noted.'),
            jrHighClasses.map(cls =>
              e('div', { key: cls.name, className: 'mb-2' },
                e('label', null,
                  e('input', { type: 'checkbox', name: cls.name, className: 'mr-2' }),
                  cls.label
                )
              )
            ),
            e('h4', { className: 'text-xl font-semibold mb-2 mt-4' }, 'High School'),
            e('p', { className: 'mb-2' }, 'Offered at the Academic Advantage location unless otherwise noted.'),
            highSchoolClasses.map(cls =>
              e('div', { key: cls.name, className: 'mb-2' },
                e('label', null,
                  e('input', { type: 'checkbox', name: cls.name, className: 'mr-2' }),
                  cls.label
                )
              )
            ),
            e('div', { className: 'mt-6' },
              e('label', { className: 'block text-gray-700 mb-2' },
                e('input', { type: 'checkbox', name: 'acknowledgment', required: true, className: 'mr-2' }),
                'I hereby request enrollment of my student in the selected classes and agree to the terms. A deposit is required per class to secure enrollment.'
              )
            ),
            e('button', { type: 'submit', className: 'mt-6 bg-indigo-600 text-blue px-6 py-3 rounded-lg hover-scale' }, 'Submit Enrollment')
          ),
          e('p', { className: 'mt-4 text-center' }, 'For questions, contact Chris Herring or Debby Herring by email at ',
            e('a', { href: 'mailto:info@empowerlearninghub.com', className: 'text-indigo-600' }, 'info@empowerlearninghub.com'), '.')
        )
      );
    }

    function Footer() {
      return e('footer', { className: 'bg-gradient text-white py-8' },
        e('div', { className: 'container mx-auto text-center' },
          e('p', null, '© 2025 Empower Learning Hub. All rights reserved.')
        )
      );
    }

    function App() {
      return e('div', null,
        e(NavBar),
        e(EnrollmentForm),
        e(Footer)
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(e(App));
  </script>
</body>
</html>
