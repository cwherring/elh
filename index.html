    function ImageCarousel({ images, interval = 4000 }) {
      const [currentIndex, setCurrentIndex] = useState(0);

      useEffect(() => {
        const timer = setInterval(() => {
          setCurrentIndex((prev) => (prev + 1) % images.length);
        }, interval);
        return () => clearInterval(timer);
      }, [images.length, interval]);

      return e('div', { className: 'relative w-full max-w-2xl mx-auto' },
        e('img', {
          src: images[currentIndex],
          alt: `Carousel image ${currentIndex + 1}`,
          loading: 'lazy',
          className: 'rounded-lg shadow-lg w-full object-cover h-auto transition-opacity duration-500'
        }),
        e('img', {
          src: images[(currentIndex + 1) % images.length],
          alt: `Students learning at Empower Learning Hub - ${currentIndex + 1}`,
          loading: 'lazy',
          style: { display: 'none' }
        })
      );
    }

    function formatDescription(description, link) {
      const [teacherLine, ...rest] = description.split('\n');
      const teacherName = teacherLine.replace('Teachers:', '').replace('Teacher:', '').trim();

      const classes = [];
      let cost = '';
      let moreInfo = '';

      rest.forEach(line => {
        if (line.startsWith('\t')) {
          classes.push(line.replace('\t', '').trim());
        } else if (line.startsWith('Cost:')) {
          cost = line.trim();
        } else if (line.startsWith('Click')) {
          moreInfo = line.trim();
        }
      });

      return e('div', { className: 'class-info' },
        e('h2', null, `Teacher(s): ${teacherName}`),
        e('h3', null, 'Classes:'),
        e('ul', null,
          classes.map((cls, idx) => e('li', { key: idx }, cls))
        ),
        cost && e('p', null, e('strong', null, 'Cost:'), ` ${cost.replace('Cost:', '').trim()}`),
        moreInfo && e('p', null, e('a', { href: link }, 'Click to see detailed information about these classes.'))
      );
    }

    function App() {
      useEffect(() => {
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
          anchor.addEventListener('click', (e) => {
            e.preventDefault();
            const targetId = anchor.getAttribute('href').substring(1);
            const targetElement = document.getElementById(targetId);
            if (targetElement) {
              const headerHeight = document.querySelector('nav').offsetHeight;
              const targetPosition = targetElement.getBoundingClientRect().top + window.pageYOffset - headerHeight;
              window.scrollTo({ top: targetPosition, behavior: 'smooth' });
            }
          });
        });
      }, []);

      return e('div', null,
        e(HeaderSection),
        e(Hero),
        e(About),
        e(Classes),
        e(Calendar),
        e(ClassRequestForm),
        e(TeacherSolicitation),
        e(Contact),
        e(Footer)
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(e(App));
